<!-- Floating chat button -->
<div class="chatbot-fab" (click)="toggleChat()" *ngIf="!isOpen">
  <i class="bi bi-chat-dots-fill"></i>
</div>

<!-- Chat window -->
<div class="chatbot-window" *ngIf="isOpen">
  <div class="chatbot-header">
    <span class="chatbot-title">Chat Support</span>
    <button class="chatbot-close" (click)="toggleChat()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="chatbot-messages" #messageContainer>
    <div *ngFor="let msg of messages" 
         class="chatbot-msg" 
         [ngClass]="{'msg-user': msg.sender === 'user', 'msg-bot': msg.sender === 'bot'}">
      <div class="msg-bubble">{{ msg.text }}</div>
      <div class="msg-time">{{ msg.timestamp | date:'shortTime' }}</div>
    </div>
  </div>

  <div class="chatbot-input-area">
    <input type="text" 
           class="chatbot-input" 
           [(ngModel)]="userInput" 
           (keydown)="onKeyDown($event)" 
           placeholder="Type a message..."
           autocomplete="off">
    <button class="chatbot-send" (click)="sendMessage()">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
